<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lichtwerk">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%;background:#000;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
<title>Lichtwerk</title>
<style>
/* Layout: one-screen photo editor in Apple's black system style. Image stage on top, thumb-reachable tool sheet at the bottom. Deliberately dark-only. */
:root{
  --bg:#000; --panel:#1c1c1e; --raise:#2c2c2e; --raise2:#3a3a3c; --line:#38383a;
  --fg:#fff; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3);
  --accent:#0a84ff; --accent-ink:#fff; --danger:#ff453a;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;letter-spacing:-.01em;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%;width:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;max-width:980px;margin:0 auto}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:4px;padding-block:6px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);min-height:44px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.mode{display:flex;padding:2px;border-radius:9px;background:rgba(118,118,128,.24);margin:0 auto 0 8px}
.mode button{height:28px;padding:0 11px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:#636366;color:var(--fg)}
.mode button[data-m="pro"][aria-pressed="true"]{background:var(--accent);color:#fff}
body:not(.pro) .pro-only{display:none!important}
.qm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.qm button{height:56px;border:0;border-radius:10px;background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);padding:0}
.qm button i{display:block;width:26px;height:18px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.maskfor{font-size:13px;color:var(--muted);margin:2px 0 8px}
.maskfor b{color:var(--fg);font-weight:600}
@media (max-width:420px){ .brand{display:none} .mode{margin-left:0} }
.btn{height:34px;min-width:34px;padding:0 14px;border-radius:17px;border:0;background:var(--raise);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:15px;white-space:nowrap;text-decoration:none}
.btn:active{opacity:.6}
.btn:disabled{opacity:.3}
.btn.icon{padding:0;width:34px;background:transparent;color:var(--accent)}
.btn.icon:disabled{color:var(--faint);opacity:1}
.btn.plain{background:transparent;color:var(--accent);padding:0 8px}
a.btn{color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

#stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;
  padding-block:6px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);touch-action:none}
#cv{display:block;-webkit-touch-callout:none}
.badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.85);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--fg);
  font-size:13px;font-weight:600;padding:6px 12px;border-radius:14px;pointer-events:none}
.tip{position:absolute;top:16px;left:max(28px,env(safe-area-inset-left,0px));right:max(28px,env(safe-area-inset-right,0px));margin:0 auto;max-width:420px;
  background:rgba(28,28,30,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px;padding:12px 14px;
  display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;pointer-events:none;z-index:5}
.tip svg{grid-row:span 2;width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;margin-top:2px}
.tip b{font-size:15px;font-weight:600}
.tip span{font-size:13px;line-height:1.4;color:var(--muted)}
.tip.out{opacity:0}
@media (prefers-reduced-motion:no-preference){ .tip{transition:opacity .35s ease} }
.curvebox{border-radius:12px;overflow:hidden;background:var(--raise);margin:10px 0 8px}
.curvebox canvas{display:block;width:100%;touch-action:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.hslr::-webkit-slider-runnable-track{background:var(--trk)!important}
.hslr::-moz-range-track{background:var(--trk)}
.hslr::-moz-range-progress{background:transparent}
.croptop{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.croptop b{margin-right:auto;font-size:16px;font-weight:600}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.8);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--muted);
  font-size:13px;padding:6px 12px;border-radius:14px;pointer-events:none;white-space:nowrap}

#drawer{background:var(--panel);border-radius:14px 14px 0 0;display:flex;flex-direction:column;height:300px}
.tabs{display:flex;margin:10px var(--gutter-r) 8px var(--gutter-l);padding:2px;border-radius:9px;background:rgba(118,118,128,.24)}
.tab{flex:1;min-width:0;height:30px;border:0;border-radius:7px;background:transparent;color:var(--fg);font-weight:500;font-size:12.5px;padding:0 2px}
.tab[aria-selected="true"]{background:#636366;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.pane{flex:1;min-height:0;overflow-y:auto;padding:4px var(--gutter-r) 12px var(--gutter-l);-webkit-overflow-scrolling:touch}

.amount{display:grid;grid-template-columns:auto 1fr 40px;align-items:center;gap:12px;margin-bottom:8px}
.amount label{font-size:15px;color:var(--fg)}
output{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);text-align:right}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 14px;border-radius:15px;border:0;background:var(--raise);font-size:14px;font-weight:500;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:#000}

.fams{display:flex;gap:22px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;margin-top:2px}
.fams::-webkit-scrollbar{display:none}
.fam{flex:none;border:0;background:none;padding:4px 0;color:var(--faint);font-size:14px;font-weight:500;letter-spacing:.03em}
.fam[aria-pressed="true"]{color:var(--fg)}
.lks{display:flex;align-items:stretch;gap:0;height:76px;border-radius:12px;overflow:hidden;margin-bottom:14px}
.swc{flex:1;min-width:0;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;
  font-size:12px;font-weight:600;letter-spacing:.08em}
.swc span{opacity:.55}
.swc svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;display:none}
.swc[aria-pressed="true"]{flex:1.45}
.swc[aria-pressed="true"]::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
.swc[aria-pressed="true"] svg{display:block;position:relative;z-index:1}
.swc[aria-pressed="true"] span{opacity:1;position:relative;z-index:1}
@media (prefers-reduced-motion:no-preference){ .swc{transition:flex .25s ease} }
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.look{flex:none;width:78px;border:0;background:none;padding:0;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;text-align:center}
.look canvas{width:78px;height:78px;border-radius:12px;display:block;background:var(--raise);box-shadow:0 0 0 0 var(--accent)}
.look span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.look[aria-pressed="true"] canvas{box-shadow:0 0 0 2.5px var(--accent)}
.look[aria-pressed="true"] span{color:var(--fg);font-weight:600}

.layers{list-style:none;margin:0;padding:0;border-radius:12px;background:var(--raise);overflow:hidden}
.layer{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:4px;padding:2px 4px;position:relative}
.layer + .layer::before{content:"";position:absolute;top:0;left:48px;right:0;height:.5px;background:var(--line)}
.layer .name{font-weight:400;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:left;padding:8px 0;display:flex;align-items:center;gap:10px}
.layer .name .txt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.mthumb{flex:none;width:30px;height:30px;border-radius:6px;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);display:block}
.lpick{padding-bottom:10px}
.lpick .chip{display:inline-flex;align-items:center;gap:6px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.mk-ico{flex:none;width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,#fff 50%,#000 50%);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.mbadge{left:max(16px,env(safe-area-inset-left,0px));transform:none;top:auto;bottom:14px;display:flex;align-items:center;gap:7px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .name small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.layer[aria-current="true"] .name{color:var(--accent);font-weight:600}
.layer .acts{display:flex;gap:0}
.layer .btn.icon{height:36px;width:36px}
.layer .btn.icon.del{color:var(--danger)}
.layer.off .name{opacity:.4}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--muted);font-size:15px;line-height:1.45;padding:12px}

.group{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:18px 0 6px 2px}
.group:first-child{margin-top:4px}
.ctl{display:grid;grid-template-columns:104px 1fr 48px;align-items:center;gap:10px;min-height:40px}
.ctl label{font-size:15px}
.ctl output{cursor:pointer;white-space:nowrap}
.ctl input[type=color]{width:100%;height:30px;border:0;border-radius:8px;background:none;padding:0}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;touch-action:pan-y;--v:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--v) 100% no-repeat,var(--raise2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 0.5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--raise2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff}
input[type=range]:disabled{opacity:.3}

#sheet{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gutter-r) calc(env(safe-area-inset-bottom,0px) + 16px) var(--gutter-l)}
#sheet .top{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:44px}
#sheet h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0 auto}
#sheet .top .btn.plain:first-child{visibility:hidden}
#sheet .opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
#sheet select{height:34px;border-radius:17px;border:0;background:var(--raise);padding:0 14px}
.saveset{display:flex;gap:8px;margin:0 auto 12px;width:100%;max-width:460px}
.saveset input{flex:1;min-width:0;height:34px;border-radius:17px;border:0;background:var(--raise);padding:0 14px;font-size:16px;-webkit-user-select:text;user-select:text}
.saveset input::placeholder{color:var(--faint)}
.lw{position:relative;flex:none;scroll-snap-align:start}
.look img{width:78px;height:78px;border-radius:12px;display:block;background:var(--raise);object-fit:cover}
.look[data-setup] .ph{width:78px;height:78px;border-radius:12px;background:var(--raise);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
.lx{position:absolute;top:-5px;right:-5px;width:24px;height:24px;border-radius:50%;border:0;background:#48484a;color:#fff;font-size:14px;line-height:24px;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.lx[data-armed]{background:var(--danger)}
#sheet .imgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#sheet img{max-width:100%;max-height:100%;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#sheet p{color:var(--muted);font-size:13px;line-height:1.45;text-align:center;margin:12px auto 0;max-width:42ch}
.spin{color:var(--muted);font-size:15px}
.tstyles{display:flex;gap:6px;overflow-x:auto;background:#000;scrollbar-width:none;
  margin:0 calc(-1 * var(--gutter-r)) 4px calc(-1 * var(--gutter-l));padding:6px var(--gutter-r) 6px var(--gutter-l)}
.tstyles::-webkit-scrollbar{display:none}
.tstyle{flex:none;min-width:84px;height:62px;border:0;border-radius:10px;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 12px}
.tstyle b{line-height:1;white-space:pre;font-weight:inherit;text-align:left}
.tstyle[aria-pressed="true"]{background:#1c1c1e;box-shadow:inset 0 -2px 0 var(--accent)}
#txt{display:block;width:100%;box-sizing:border-box;min-height:60px;resize:none;border:0;border-radius:12px;background:var(--raise);color:var(--fg);
  padding:10px 12px;margin:8px 0 10px;font:16px/1.35 var(--ui);-webkit-user-select:text;user-select:text}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-height:40px}
.sw{width:30px;height:30px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw-custom{position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;background:conic-gradient(#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a)}
.sw-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0}
.seg{display:flex;padding:2px;border-radius:9px;background:rgba(118,118,128,.24)}
.seg button{flex:1;height:28px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:#636366;font-weight:600}
.ctl select{height:32px;border:0;border-radius:8px;background:var(--raise);padding:0 8px;width:100%;min-width:0}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--raise2);position:relative;margin:0;justify-self:start;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.switch:checked{background:#30d158}
.switch:checked::after{transform:translateX(20px)}
@media (prefers-reduced-motion:no-preference){ .switch,.switch::after{transition:all .2s} }
@media (min-width:760px){ #drawer{height:320px} }
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="brand">Lichtwerk</div>
    <div class="mode" id="mode" role="group" aria-label="Modus"><button data-m="fast">Fast</button><button data-m="pro">Pro</button></div>
    <button class="btn icon" id="undo" aria-label="Rückgängig"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn icon" id="redo" aria-label="Wiederholen"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="btn icon" id="cropBtn" aria-label="Zuschneiden und Begradigen"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></button>
    <button class="btn icon" id="open" aria-label="Foto öffnen"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></button>
    <button class="btn primary" id="exportBtn">Sichern</button>
  </header>

  <div id="stage">
    <canvas id="cv" aria-label="Bildvorschau. Gedrückt halten zeigt das Original. Texte lassen sich verschieben, mit zwei Fingern skalieren und drehen."></canvas>
    <div class="badge" id="origBadge" hidden>Original</div>
    <div class="badge mbadge" id="maskBadge" hidden></div>
    <div class="tip" id="tip" hidden></div>
    <div class="hint" id="hint">Beispielbild · Gedrückt halten = Vorher</div>
  </div>

  <section id="drawer">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="looks" aria-selected="true">Looks</button>
      <button class="tab" role="tab" data-tab="light" aria-selected="false">Effekte</button>
      <button class="tab" role="tab" data-tab="text" aria-selected="false">Text</button>
      <button class="tab" role="tab" data-tab="layers" aria-selected="false">Ebenen</button>
      <button class="tab pro-only" role="tab" data-tab="adjust" aria-selected="false">Regler</button>
      <button class="tab pro-only" role="tab" data-tab="mask" aria-selected="false">Maske</button>
    </div>
    <div class="pane" id="p-looks">
      <div class="fams" id="cats"></div>
      <div class="lks" id="swatches" hidden></div>
      <div class="strip" id="strip"></div>
      <div class="amount"><label for="amt">Stärke</label><input type="range" id="amt" min="0" max="1" step="0.01"><output id="amtOut"></output></div>
    </div>
    <div class="pane" id="p-light" hidden></div>
    <div class="pane" id="p-text" hidden></div>
    <div class="pane" id="p-layers" hidden>
      <ul class="layers" id="layerList"></ul>
      <div class="bar">
        <button class="btn" id="addLayer">+ Farb-Ebene</button>
        <button class="btn" id="addLight">+ Licht</button>
        <button class="btn" id="addText">+ Text</button>
        <button class="btn" id="dupLayer">Duplizieren</button>
        <button class="btn" id="saveLook">Als eigenen Look sichern</button>
      </div>
    </div>
    <div class="pane" id="p-adjust" hidden></div>
    <div class="pane" id="p-mask" hidden></div>
    <div class="pane" id="p-crop" hidden></div>
  </section>
</div>

<div id="sheet" hidden>
  <div class="top">
    <button class="btn plain" tabindex="-1" aria-hidden="true">Fertig</button>
    <h2>Bild sichern</h2>
    <button class="btn plain" id="sheetClose" style="font-weight:600">Fertig</button>
  </div>
  <div class="opts">
    <select id="exSize" aria-label="Größe">
      <option value="0">Volle Auflösung</option>
      <option value="2048">2048 px</option>
      <option value="1080">1080 px</option>
    </select>
    <select id="exFmt" aria-label="Format">
      <option value="image/jpeg">JPEG</option>
      <option value="image/png">PNG</option>
    </select>
    <button class="btn" id="shareBtn" hidden>Teilen …</button>
    <a class="btn" id="dlLink" hidden>Datei laden</a>
  </div>
  <form class="saveset" id="saveSetForm">
    <input type="text" id="setName" maxlength="40" placeholder="Name für dieses Setup" aria-label="Name für das Setup" autocomplete="off">
    <button class="btn" type="submit" id="setSave">Setup speichern</button>
  </form>
  <div class="imgwrap" id="exWrap"><span class="spin">Wird berechnet …</span></div>

function curveLUT(pts){

  for(let i = 0; i < n-1; i++) d[i] = (ys[i+1] - ys[i]) / Math.max(1e-6, xs[i+1] - xs[i]);
  m[0] = d[0]; m[n-1] = d[n-2];
  for(let i = 1; i < n-1; i++) m[i] = d[i-1]*d[i] <= 0 ? 0 : (d[i-1] + d[i]) / 2;

  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", {willReadFrequently:true}); x.imageSmoothingQuality = "high"; x.drawImage(scaled(Math.max(w, h)), 0, 0, w, h);

/* ---------- Gradationskurve ---------- */
const CURVE_PRESETS = [["Linear", null], ["S leicht", [[0,0],[.25,.2],[.75,.8],[1,1]]], ["S stark", [[0,0],[.25,.14],[.75,.87],[1,1]]],
  ["Matt", [[0,.08],[.3,.3],[.75,.78],[1,.96]]], ["Heller", [[0,0],[.5,.6],[1,1]]], ["Dunkler", [[0,0],[.5,.4],[1,1]]]];

function ensureCurve(L){ if(!L.p.curve) L.p.curve = {rgb:[[0,0],[1,1]], r:[[0,0],[1,1]], g:[[0,0],[1,1]], b:[[0,0],[1,1]]}; return L.p.curve; }
function lumHist(){
  try {
    const c = document.createElement("canvas"); c.width = 96; c.height = 72;
    const x = c.getContext("2d", {willReadFrequently:true}); x.drawImage(cv, 0, 0, 96, 72);
    const d = x.getImageData(0, 0, 96, 72).data, h = new Float32Array(64);
    for(let i = 0; i < d.length; i += 4) h[Math.min(63, ((d[i]*.2126 + d[i+1]*.7152 + d[i+2]*.0722) / 4) | 0)]++;

}
function buildCurve(box, L){
  const chSeg = document.createElement("div"); chSeg.className = "seg";
  for(const [k, n] of [["rgb","RGB"],["r","Rot"],["g","Grün"],["b","Blau"]]){
    const b = document.createElement("button"); b.textContent = n; b.setAttribute("aria-pressed", S.curveCh === k);
    b.onclick = () => { S.curveCh = k; chSeg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); drawC(); };
    chSeg.append(b);
  }
  box.append(chSeg);
  const wrap = document.createElement("div"); wrap.className = "curvebox"; const c = document.createElement("canvas"); wrap.append(c); box.append(wrap);
  const dpr = Math.min(window.devicePixelRatio || 1, 3), cssW = Math.max(240, (box.clientWidth || 340) - 4), cssH = Math.round(Math.min(230, cssW*.62));
  c.style.height = cssH + "px"; c.width = Math.round(cssW*dpr); c.height = Math.round(cssH*dpr);
  const x = c.getContext("2d"), pad = 12*dpr, hist = lumHist();
  const pts = () => (L.p.curve && L.p.curve[S.curveCh]) || [[0,0],[1,1]];

    hist.forEach((v, i) => x.lineTo(X((i + .5)/64), Y(v*.9))); x.lineTo(X(1), Y(0)); x.closePath(); x.fill();
    x.strokeStyle = "rgba(255,255,255,.09)"; x.lineWidth = dpr; x.beginPath();
    for(const f of [.25,.5,.75]){ x.moveTo(X(f), Y(0)); x.lineTo(X(f), Y(1)); x.moveTo(X(0), Y(f)); x.lineTo(X(1), Y(f)); }
    x.stroke(); x.setLineDash([4*dpr, 4*dpr]); x.beginPath(); x.moveTo(X(0), Y(0)); x.lineTo(X(1), Y(1)); x.stroke(); x.setLineDash([]);
    if(S.curveCh !== "rgb" && L.p.curve){ const lm = curveLUT(L.p.curve.rgb); x.strokeStyle = "rgba(255,255,255,.25)"; x.lineWidth = 1.5*dpr; x.beginPath(); for(let i = 0; i < 256; i += 3) i ? x.lineTo(X(i/255), Y(lm[i])) : x.moveTo(X(0), Y(lm[0])); x.stroke(); }
    const lut = curveLUT(pts()); x.strokeStyle = CURVE_COL[S.curveCh]; x.lineWidth = 2.2*dpr; x.beginPath();
    for(let i = 0; i < 256; i++) i ? x.lineTo(X(i/255), Y(lut[i])) : x.moveTo(X(0), Y(lut[0]));
    x.stroke();
    for(const q of pts()){ x.fillStyle = "#fff"; x.strokeStyle = "rgba(0,0,0,.6)"; x.lineWidth = 1.5*dpr; x.beginPath(); x.arc(X(q[0]), Y(q[1]), 6*dpr, 0, 7); x.fill(); x.stroke(); }
  }
  const pos = e => { const r = c.getBoundingClientRect(); return [((e.clientX - r.left)*dpr - pad) / (c.width - 2*pad), 1 - ((e.clientY - r.top)*dpr - pad) / (c.height - 2*pad)]; };

    else { let i = cur.findIndex(q => q[0] > px); if(i <= 0) i = cur.length - 1; cur.splice(i, 0, [clamp(px, .01, .99), clamp(py, 0, 1)]); drag = {i}; }

  };
  c.onpointerup = c.onpointercancel = () => { if(drag && drag.remove){ L.p.curve[S.curveCh].splice(drag.i, 1); changed(false); drawC(); } drag = null; };
  c.ondblclick = e => { const [px, py] = pos(e), cur = L.p.curve && L.p.curve[S.curveCh]; if(!cur) return;
    const i = cur.findIndex((q, j) => j > 0 && j < cur.length-1 && Math.hypot(q[0]-px, q[1]-py) < .06); if(i > 0){ cur.splice(i, 1); changed(false); drawC(); } };
  drawC();
  const bar = document.createElement("div"); bar.className = "chips"; bar.style.paddingTop = "2px";
  for(const [n, pr] of CURVE_PRESETS){
    const b = document.createElement("button"); b.className = "chip"; b.textContent = n;
    b.onclick = () => { hideTip(); const cur = ensureCurve(L); cur[S.curveCh] = pr ? pr.map(q => [...q]) : [[0,0],[1,1]]; changed(false); drawC(); };

  }
  box.append(bar);
  const p = document.createElement("p"); p.className = "empty"; p.style.padding = "4px 2px";
  p.textContent = "Tippen fügt einen Punkt hinzu, ziehen verschiebt ihn, aus dem Feld ziehen oder Doppeltippen entfernt ihn.";
  const rs = document.createElement("button"); rs.className = "btn"; rs.textContent = "Kurve zurücksetzen"; rs.onclick = () => { L.p.curve = null; changed(false); drawC(); };
  box.append(p, rs);
}

  if(name !== "mask") S.pickMode = false;
  setTimeout(updateMaskBadge, 0);
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === name));

const swatchCache = {}; let SWR = null;
function swatchColor(lk){
  if(swatchCache[lk.key]) return swatchCache[lk.key];
  if(!SWR){
    SWR = new Renderer(document.createElement("canvas"));
    const c = document.createElement("canvas"); c.width = 48; c.height = 4;
    const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 48, 0);
    g.addColorStop(0, "#3c3a38"); g.addColorStop(1, "#d6d2ce"); x.fillStyle = g; x.fillRect(0, 0, 48, 4);
    SWR.setSource(c);
  }

  const gl = SWR.gl, px = new Uint8Array(48*4*4); gl.readPixels(0, 0, 48, 4, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let r = 0, g = 0, b = 0; for(let i = 0; i < px.length; i += 4){ r += px[i]; g += px[i+1]; b += px[i+2]; }
  const n = px.length/4; r /= n; g /= n; b /= n;
  const l = .2126*r + .7152*g + .0722*b, k = 2.4;            // exaggerate the tint so families read apart
  const c = [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, l + (v - l)*k))));
  return swatchCache[lk.key] = {css:`rgb(${c[0]},${c[1]},${c[2]})`, dark: l < 150};
}

/* ---------- LUT loading ---------- */
$("#lutFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  const L = selLayer(); if(!L) return;
  try {
    const txt = await f.text();
    let N = 0, min = [0,0,0], max = [1,1,1]; const vals = [];
    for(const raw of txt.split(/\r?\n/)){
      const line = raw.trim(); if(!line || line[0] === "#") continue;
      const parts = line.split(/\s+/);
      if(parts[0] === "LUT_3D_SIZE") N = +parts[1];
      else if(parts[0] === "DOMAIN_MIN") min = parts.slice(1,4).map(Number);
      else if(parts[0] === "DOMAIN_MAX") max = parts.slice(1,4).map(Number);
      else if(/^[-\d.]/.test(parts[0]) && parts.length >= 3) vals.push(+parts[0], +parts[1], +parts[2]);
    }
    if(!N || vals.length < N*N*N*3) throw new Error("Keine 3D-LUT gefunden");
    const data = new Uint8Array(N*N*N*3);
    for(let i = 0; i < N*N*N; i++){
      const r = i % N, g = Math.floor(i/N) % N, b = Math.floor(i/(N*N));
      const o = (g*N*N + b*N + r)*3;
      for(let c = 0; c < 3; c++) data[o+c] = Math.max(0, Math.min(255, Math.round((vals[i*3+c]-min[c])/(max[c]-min[c])*255)));
    }
    const key = "lut" + Date.now().toString(36);
    LUTS[key] = {size:N, data};
    L.p.lut = key; L.p.lutName = f.name; L.p.lutAmt = 1; changed(true);
  } catch(err){ toast("Diese Datei ließ sich nicht als .cube-LUT lesen."); }
};

async function runExport(){

  await new Promise(r => setTimeout(r, 30));

  const src = scaled(Math.min(lim, 4096));
  const gc = document.createElement("canvas"), oc = document.createElement("canvas");
  let r;
  try { await document.fonts.ready; } catch {}
  try {
    r = new Renderer(gc); r.setSource(src); r.render(S.layers, S.masks);
    oc.width = r.W; oc.height = r.H;
    const o = oc.getContext("2d"); o.drawImage(gc, 0, 0); drawBlurs(o, r.W, r.H); drawLights(o, r.W, r.H); drawTexts(o, r.W, r.H);
  }

  if(!exportBlob){ wrap.innerHTML = '<span class="spin">Export ist fehlgeschlagen. Wähle eine kleinere Größe.</span>'; return; }
  if(exportUrl) URL.revokeObjectURL(exportUrl);
  exportUrl = URL.createObjectURL(exportBlob);
  const img = new Image(); img.src = exportUrl; img.alt = "Fertiges Bild";
  wrap.replaceChildren(img);
  const ext = type === "image/png" ? "png" : "jpg";
  const name = `${S.fileName}-lichtwerk.${ext}`;
  if(!inFrame){
    const a = $("#dlLink"); a.href = exportUrl; a.download = name; a.hidden = false;
    const file = new File([exportBlob], name, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      const s = $("#shareBtn"); s.hidden = false;
      s.onclick = () => navigator.share({files:[file]}).catch(() => {});
    }
  }
  lastExport = oc;
  saveSetup(serializeSetup("Zuletzt", true, oc));
  $("#sheet p").textContent = `${oc.width} × ${oc.height} px · Bild gedrückt halten und „Zu Fotos hinzufügen“ wählen. Das Setup liegt jetzt unter Looks › Setups.`;
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){
  let t = $("#toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "hint";
    t.style.cssText = "position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 320px);color:var(--fg);z-index:30;white-space:normal;text-align:center;max-width:90vw";
    document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800);
}

/* ---------- Demo image ---------- */
function demoImage(){
  const W = 1600, H = 1200, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  let g = x.createLinearGradient(0,0,0,H*.62);
  g.addColorStop(0,"#3d5f8f"); g.addColorStop(.55,"#c9a58a"); g.addColorStop(1,"#f3c98f");
  x.fillStyle = g; x.fillRect(0,0,W,H);
  g = x.createRadialGradient(W*.68,H*.5,0,W*.68,H*.5,W*.35);
  g.addColorStop(0,"rgba(255,236,190,.95)"); g.addColorStop(.12,"rgba(255,214,150,.6)"); g.addColorStop(1,"rgba(255,200,140,0)");
  x.fillStyle = g; x.fillRect(0,0,W,H);
  x.fillStyle = "#fff6dc"; x.beginPath(); x.arc(W*.68,H*.5,38,0,7); x.fill();
  const ridge = (base, amp, col, seed) => {
    x.fillStyle = col; x.beginPath(); x.moveTo(0,H);
    for(let i = 0; i <= W; i += 8){
      const y = base + Math.sin(i*.004+seed)*amp + Math.sin(i*.011+seed*2)*amp*.45 + Math.sin(i*.031+seed*3)*amp*.15;
      x.lineTo(i,y);
    }
    x.lineTo(W,H); x.fill();
  };
  ridge(H*.52,40,"#8a7a8c",1); ridge(H*.57,34,"#5d5670",2.3); ridge(H*.62,26,"#3b3a4e",4.1);
  g = x.createLinearGradient(0,H*.62,0,H);
  g.addColorStop(0,"#d9b58e"); g.addColorStop(.3,"#7c6f80"); g.addColorStop(1,"#2a2d3c");
  x.fillStyle = g; x.fillRect(0,H*.64,W,H*.36);
  x.globalAlpha = .5; x.fillStyle = "#ffe4b0";
  for(let i = 0; i < 26; i++){ const y = H*.66 + i*9; x.fillRect(W*.68 - 60 + Math.sin(i)*20, y, 120 - i*3, 2); }
  x.globalAlpha = 1;
  x.fillStyle = "#1c1f22"; x.beginPath(); x.moveTo(0,H);
  for(let i = 0; i <= W*.42; i += 6) x.lineTo(i, H*.8 + Math.sin(i*.02)*12 + (i/W)*90);
  x.lineTo(W*.42,H); x.fill();
  for(let t = 0; t < 9; t++){
    const tx = 40 + t*62 + (t%2)*14, th = 170 + (t*37)%90, ty = H*.82 + (tx/W)*90;
    x.beginPath(); x.moveTo(tx, ty - th);
    for(let k = 0; k <= 6; k++){ const yy = ty - th + k*th/6, ww = k*th*.075; x.lineTo(tx + ww, yy); x.lineTo(tx + ww*.55, yy); }
    for(let k = 6; k >= 0; k--){ const yy = ty - th + k*th/6, ww = k*th*.075; x.lineTo(tx - ww*.55, yy); x.lineTo(tx - ww, yy); }
    x.fill();
  }
  return c;
}

/* ---------- iOS slider fill ---------- */
const fillRange = el => { const a = +el.min, b = +el.max; el.style.setProperty("--v", ((+el.value - a) / (b - a) * 100) + "%"); };
document.addEventListener("input", e => { if(e.target.type === "range") fillRange(e.target); }, true);
new MutationObserver(() => document.querySelectorAll('input[type=range]').forEach(fillRange)).observe(document.body, {childList:true, subtree:true});
const _sync = syncAmount; syncAmount = function(){ _sync(); fillRange(amt); };

/* ---------- Start ---------- */
S.source = demoImage();
setMode(S.pro);
setupPreview(); prepareThumbSource(); refreshUI(); updateHistBtns();
})();
